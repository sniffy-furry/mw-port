name: Build Desktop

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential \
            libgl1-mesa-dev libx11-dev libxrandr-dev libxi-dev \
            libxcursor-dev libxinerama-dev libwayland-dev libxkbcommon-dev

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release -j

      - name: Run parser tests (no game files needed to just check it builds)
        run: cmake --build build --target nfsmw_tests -j

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: nfsmw_port-linux
          path: build/nfsmw_port
