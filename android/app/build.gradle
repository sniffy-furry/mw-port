apply plugin: 'com.android.application'

android {
    namespace 'com.nfsmwport.app'
    compileSdk 34
    ndkVersion "26.1.10909125"

    defaultConfig {
        applicationId "com.nfsmwport.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "0.1"

        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_shared"
                abiFilters 'arm64-v8a'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // no Java/Kotlin sources -- this is a pure-native (NativeActivity) app
    sourceSets {
        main {
            java.srcDirs = []
            manifest.srcFile 'src/main/AndroidManifest.xml'
        }
    }
}
